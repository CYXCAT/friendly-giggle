name: InfoSheetApp
options:
  bundleIdPrefix: com.yingxiao
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
targets:
  InfoSheetApp:
    type: application
    platform: iOS
    sources:
      - path: InfoSheetApp
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yingxiao.InfoSheetApp
        PRODUCT_NAME: InfoSheetApp
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: InfoSheetApp/Info.plist
      properties:
        API_BASE_URL: https://info-sheet.vercel.app
        GIDClientID: 107833156473-t3dvs21gici32eogko5dfqdu8dmhpm1d.apps.googleusercontent.com
        GIDServerClientID: 107833156473-gshdcdat68ammg89cugvov3gjreg8jf2.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.107833156473-t3dvs21gici32eogko5dfqdu8dmhpm1d
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
schemes:
  InfoSheetApp:
    build:
      targets:
        InfoSheetApp: all
    run:
      config: Debug
